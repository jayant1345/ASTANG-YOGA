{% extends "base.html" %}
{% block title %}{{ yc.name }} — Attendance QR{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 text-center">
    <h5 class="fw-bold mb-1"><i class="bi bi-qr-code-scan me-2"></i>{{ yc.name }}</h5>
    <p class="text-muted small mb-1">{{ yc.schedule_time or '' }}</p>
    <p class="text-muted small mb-4">Students scan this QR to mark attendance when a session is active.</p>

    <div class="card border-0 shadow-sm p-3 mb-3">
      <img src="data:image/png;base64,{{ qr_b64 }}" alt="Class QR"
           class="img-fluid mx-auto" style="max-width:260px; border-radius:8px">
    </div>

    <p class="text-muted small mb-3">This QR is permanent for this class batch.</p>
    <a href="{{ url_for('admin.classes') }}" class="btn btn-outline-primary btn-sm">
      <i class="bi bi-arrow-left me-1"></i>Back to Classes
    </a>
  </div>
</div>
{% endblock %}
