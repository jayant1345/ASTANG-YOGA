<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ yc.name }} — Attendance QR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root { --yoga-green: #3a6b35; }
    body {
      background: linear-gradient(150deg, #5a2d00 0%, #a34c06 45%, #c96012 75%, #e8a24a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: white;
    }
    .qr-card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    .qr-card img { width: 100%; border-radius: 12px; }
    .status-pill {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: .85rem;
      font-weight: 600;
    }
    .btn-ctrl {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: .85rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .btn-ctrl:hover { background: rgba(255,255,255,0.25); }
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .live-dot { animation: pulse 1.5s infinite; }
  </style>
</head>
<body>

  <!-- School name -->
  <div class="text-center mb-3">
    <div style="font-size:3rem; line-height:1; opacity:.9; text-shadow:0 2px 8px rgba(0,0,0,0.3)">ॐ</div>
    <h3 class="fw-bold mb-0" style="letter-spacing:.06em; text-shadow:0 2px 6px rgba(0,0,0,0.25)">Ashtang Yoga School</h3>
    <p class="mb-0 opacity-75" style="font-size:.9rem; letter-spacing:.08em; text-transform:uppercase;">Attendance QR Code</p>
  </div>

  <!-- QR Card -->
  <div class="qr-card">
    <h5 class="fw-bold mb-1" style="color:#a34c06">{{ yc.name }}</h5>
    <p class="text-muted mb-3" style="font-size:.9rem">
      <i class="bi bi-clock me-1"></i>{{ yc.schedule_time }}
      {% if yc.location %} &nbsp;·&nbsp; <i class="bi bi-geo-alt me-1"></i>{{ yc.location }}{% endif %}
    </p>

    <img src="data:image/png;base64,{{ qr_b64 }}" alt="Attendance QR">

    <div class="mt-3">
      {% if active_session %}
      <span class="status-pill" style="background:#d4edda; color:#155724;">
        <span class="live-dot me-1">●</span> Session Active — Scan Now
      </span>
      {% else %}
      <span class="status-pill" style="background:#fff3cd; color:#856404;">
        <i class="bi bi-hourglass me-1"></i> Waiting for session to start
      </span>
      {% endif %}
    </div>

    <p class="text-muted mt-3 mb-0" style="font-size:.75rem">
      Scan with your phone camera or the app
    </p>
  </div>

  <!-- Clock -->
  <div class="mt-4 text-center no-print">
    <span id="clock" style="font-size:2rem; font-weight:700; letter-spacing:.1em; opacity:.9"></span>
    <p style="opacity:.6; font-size:.8rem" id="dateline"></p>
  </div>

  <!-- Controls -->
  <div class="d-flex gap-2 mt-3 no-print">
    <button class="btn-ctrl" onclick="location.reload()">
      <i class="bi bi-arrow-clockwise me-1"></i>Refresh
    </button>
    <button class="btn-ctrl" onclick="window.print()">
      <i class="bi bi-printer me-1"></i>Print
    </button>
    <button class="btn-ctrl" id="fsBtn" onclick="toggleFullscreen()">
      <i class="bi bi-fullscreen me-1"></i>Fullscreen
    </button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Live clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    document.getElementById('dateline').textContent =
      now.toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Auto-refresh page every 30s to update session status
  setTimeout(() => location.reload(), 30000);

  // Fullscreen toggle
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
      document.getElementById('fsBtn').innerHTML = '<i class="bi bi-fullscreen-exit me-1"></i>Exit Fullscreen';
    } else {
      document.exitFullscreen();
      document.getElementById('fsBtn').innerHTML = '<i class="bi bi-fullscreen me-1"></i>Fullscreen';
    }
  }
</script>
</body>
</html>
